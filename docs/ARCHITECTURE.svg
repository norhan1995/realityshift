<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#090b0e"/>
<style>.t{font-family:Arial,sans-serif;fill:#f3f5f7}.m{font-family:Arial,sans-serif;fill:#7f8994}.h{font-size:48px;font-weight:700}.b{font-size:22px;font-weight:700}.s{font-size:16px}.box{fill:#11151a;stroke:#303841;stroke-width:2}.lime{stroke:#b9ff4b}.cyan{stroke:#63cfff}.red{stroke:#ff6262}</style>
<text x="80" y="80" class="t h">REALITY<tspan fill="#b9ff4b">SHIFT</tspan></text><text x="80" y="118" class="m s">Adaptive agent architecture · change your mind when reality changes</text><line x1="80" y1="150" x2="1520" y2="150" stroke="#252b32" stroke-width="2"/>
<rect x="80" y="220" width="240" height="145" rx="18" class="box lime"/><text x="110" y="265" class="t b">PLAN vN</text><text x="110" y="302" class="m s">Goal + assumptions</text><text x="110" y="330" class="m s">+ immutable constraints</text>
<text x="340" y="305" class="m h">→</text><rect x="405" y="220" width="240" height="145" rx="18" class="box"/><text x="435" y="265" class="t b">EXECUTE</text><text x="435" y="302" class="m s">One reversible step</text><text x="435" y="330" class="m s">against current world</text>
<text x="665" y="305" class="m h">→</text><rect x="730" y="220" width="240" height="145" rx="18" class="box cyan"/><text x="760" y="265" class="t b">OBSERVE</text><text x="760" y="302" class="m s">Event-driven signal</text><text x="760" y="330" class="m s">No fixed polling timer</text>
<text x="990" y="305" class="m h">→</text><rect x="1055" y="220" width="310" height="145" rx="18" class="box red"/><text x="1085" y="265" class="t b">CONTRADICTION CHECK</text><text x="1085" y="302" class="m s">Did a plan precondition</text><text x="1085" y="330" class="m s">become false?</text>
<line x1="1210" y1="365" x2="1210" y2="440" stroke="#ff6262" stroke-width="3"/><polygon points="1210,452 1200,435 1220,435" fill="#ff6262"/><rect x="1045" y="465" width="330" height="145" rx="18" class="box red"/><text x="1075" y="510" class="t b">EVIDENCE GATE</text><text x="1075" y="547" class="m s">Trust · corroboration</text><text x="1075" y="575" class="m s">before replanning</text>
<text x="990" y="550" class="m h">←</text><rect x="650" y="465" width="310" height="145" rx="18" class="box lime"/><text x="680" y="510" class="t b">RE-EVALUATE</text><text x="680" y="547" class="m s">Generate plan vN+1</text><text x="680" y="575" class="m s">inside mission constraints</text>
<text x="595" y="550" class="m h">←</text><rect x="250" y="465" width="320" height="145" rx="18" class="box lime"/><text x="280" y="510" class="t b">VALIDATE + REVISE</text><text x="280" y="547" class="m s">Persist new version +</text><text x="280" y="575" class="m s">causal revision trace</text>
<path d="M410 465 C410 405 210 420 200 365" fill="none" stroke="#b9ff4b" stroke-width="3" stroke-dasharray="8 8"/><polygon points="200,365 193,382 211,378" fill="#b9ff4b"/>
<rect x="80" y="700" width="440" height="105" rx="15" class="box"/><text x="110" y="742" class="t b">Persisted world model</text><text x="110" y="775" class="m s">events · assumptions · plan versions · revisions</text>
<rect x="580" y="700" width="440" height="105" rx="15" class="box"/><text x="610" y="742" class="t b">Static baseline</text><text x="610" y="775" class="m s">shows the exact failure adaptation prevents</text>
<rect x="1080" y="700" width="440" height="105" rx="15" class="box"/><text x="1110" y="742" class="t b">Failure containment</text><text x="1110" y="775" class="m s">weak/conflicting signal → HOLD + VERIFY</text>
<text x="80" y="855" class="m s">Trigger: new_signal ∧ invalidates(plan_precondition) ∧ evidence_gate_passes → constrained replan</text>
</svg>